services:
  kali-mcp:
    build: .
    container_name: kali-security-mcp
    ports:
      - "8000:8000"
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8000
    volumes:
      - ./wordlists:/home/pentest/wordlists
      - ./results:/home/pentest/results
    networks:
      - pentest-network
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE

networks:
  pentest-network:
    driver: bridge